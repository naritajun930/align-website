png", "photos": [{"src": "assets/images/reviews/r005-1.jpg", "width": 802, "height": 603, "alt": "ALIGN gym クチコミ写真 - Hoo様"}]}, {"id": "r006", "displayName": "Ryosuke", "rating": 5, "relativeDate": "6日前", "approxDate": "2026-07-14", "hasPhoto": false, "featured": false, "tags": ["coaching"], "excerpt": "普段のトレーニングの悩みが解決し効率よくこれから取り組んでいけそうです。", "body": "マンツーマンでの指導なのでトレーニングで意識した方が良いポイントを的確に教えていただけます。\n普段のトレーニングの悩みが解決し効率よくこれから取り組んでいけそうです。\n個人に合わせた種目も考えてくれるので、これからもぜひ相談させてください！\nお世話になります！！", "sourceFile": "スクリーンショット 2026-07-20 19.18.46.png", "photos": []}, {"id": "r007", "displayName": "K.Y", "rating": 5, "relativeDate": "1週間前", "approxDate": "2026-07-13", "hasPhoto": true, "featured": true, "tags": ["access", "aroma", "beginner", "coaching"], "excerpt": "初めてパーソナルジムに行ってみましたが、また行きたいと思えるほどでした。", "body": "栄・矢場町駅から近く徒歩で通える距離にあるパーソナルジムです。\n\n店内はアロマの香りでとてもリラックスした状態でトレーニングできます。\n\n初めてパーソナルジムに行ってみましたがトレーナーが凄く優しく丁寧に教えてくれてまた行きたいと思えるほどでした。\nまた、知識も凄く豊富でトレーニングに関する説明もとてもわかりやすくしっかりと鍛えたい部分を鍛えることができると実感できました。\n\n自分みたいに初めての方に特にオススメです。\n行ってよかったーと思えるような素敵なパーソナルジムです。\nぜひ、気軽にみなさん行ってみてください！！\n\nこれからも応援してます！！", "sourceFile": "スクリーンショット 2026-07-20 19.16.10.png", "photos": [{"src": "assets/images/reviews/r007-1.jpg", "width": 800, "height": 603, "alt": "ALIGN gym クチコミ写真 - K.Y様"}]}, {"id": "r008", "displayName": "ムーンランド", "rating": 5, "relativeDate": "1週間前", "approxDate": "2026-07-13", "hasPhoto": true, "featured": false, "tags": ["posture", "coaching", "access", "aroma", "price"], "excerpt": "我流で3年半やってきましたが、プロに教えてもらうと上達のスピードが全然違うと感じました！", "body": "我流で筋トレを3年半やってきましたが、改めてプロに教えてもらうのと、我流では全然上達のスピードが違うなと感じました！\nピラティス要素も含まれていて、姿勢改善はもちろんのこと、その人にあったトレーニング方法を提案してくれるっというのも魅力的です！\nそれと、立地も良く、栄・矢場町からも近く、また、アロマのいい香りがフロア全体に広がっているため、いい香りに包まれてトレーニングできるのも魅力的だなと感じました！\n\n【料金の評価】手頃な料金", "sourceFile": "スクリーンショット 2026-07-20 19.16.18.png", "photos": [{"src": "assets/images/reviews/r008-1.jpg", "width": 1154, "height": 1382, "alt": "ALIGN gym クチコミ写真 - ムーンランド様"}]}, {"id": "r009", "displayName": "とき", "rating": 5, "relativeDate": "1週間前", "approxDate": "2026-07-13", "hasPhoto": true, "featured": true, "tags": ["access", "clean", "aroma", "coaching", "beginner", "diet"], "excerpt": "フォームを一つひとつ丁寧に確認しながら教えてくれるので、初心者でも安心して取り組めました。", "body": "栄駅・矢場町駅から徒歩ですぐでアクセスが良く、とても通いやすいパーソナルジムです！\n\n店内は清潔感があり、アロマの香りも心地よく、リラックスした雰囲気の中でトレーニングができます。\n\n特に感動したのはトレーナーさんの指導です。フォームを一つひとつ丁寧に確認しながら、分かりやすく的確に教えてくれるので、初心者でも安心して取り組めました。補助もしっかりしてくれるので、正しいフォームで効かせたい部位を意識しながらトレーニングできます。\n\nまた、とても優しく話しやすい方なので、楽しくトレーニングできるのも魅力です！「運動初心者だけど始めてみたい」「ダイエットやボディメイクを頑張りたい」という方にもおすすめできるジムだと思います。\n\nこれからもよろしくお願いします！", "sourceFile": "スクリーンショット 2026-07-20 19.18.53.png", "photos": [{"src": "assets/images/reviews/r009-1.jpg", "width": 1200, "height": 1088, "alt": "ALIGN gym クチコミ写真 - とき様"}]}, {"id": "r010", "displayName": "Y.Y", "rating": 5, "relativeDate": "2週間前", "approxDate": "2026-07-06", "hasPhoto": true, "featured": true, "tags": ["access", "coaching", "aroma", "diet"], "excerpt": "「今まで見たことのない自分に出会いたい」という思いで通い始めました。", "body": "「今まで見たことのない自分に出会いたい」「自分に自信を持ちたい」という思いで通い始めました。\n\n車で通っていますが、近くにパーキングがたくさんあるので駐車場に困ることがなく、とても通いやすいです。今回はモニター特典を利用して始めることができたので、一歩踏み出すきっかけになりました。\n\nトレーナーさんは知識がとても豊富で、一つひとつ丁寧に分かりやすく教えてくださるので、安心してトレーニングに取り組めています。\n\nトレーニング中はとても辛いですが、終わった後の達成感やスッキリした気持ちは格別です。翌日には狙った部位がしっかり筋肉痛になるので、ちゃんと効かせられたことを実感でき、それが次のトレーニングへのモチベーションにもつながっています。\n\nまた、店内はアロマの香りでとても心地よく、落ち着いた空間でトレーニングに集中できるのも魅力です。\n\nまだ通い始めたばかりですが、これから自分の体がどう変わっていくのかとても楽しみです。目標に向かって頑張っていきたいと思います！", "sourceFile": "スクリーンショット 2026-07-20 19.16.02.png", "photos": [{"src": "assets/images/reviews/r010-1.jpg", "width": 390, "height": 598, "alt": "ALIGN gym クチコミ写真 - Y.Y様"}, {"src": "assets/images/reviews/r010-2.jpg", "width": 392, "height": 598, "alt": "ALIGN gym クチコミ写真 - Y.Y様"}]}, {"id": "r011", "displayName": "H", "rating": 5, "relativeDate": "2週間前", "approxDate": "2026-07-06", "hasPhoto": true, "featured": true, "tags": ["clean", "aroma", "counseling", "posture", "access"], "excerpt": "今までなかなか続かなかったジムが、ここでなら楽しく継続できそうです！！", "body": "店内は清潔感があり、アロマもこだわっているみたいでとても癒される香りです！\n\nトレーナーさんはカウンセリングも丁寧で優しく、自分の目標や悩みに合わせてストレッチやピラティス、トレーニングをしてくれます。\nトレーニング中しんどくなりそうな時でも、あともうひと頑張りできるような声がけやサポートをしてくれるので、今までなかなか続かなかったジムがここでなら楽しく継続できそうです！！\n\nアクセスも栄駅からとても近く、天候に関係なくストレスなく通えそうなので、これからお世話になろうとおもいます！！", "sourceFile": "スクリーンショット 2026-07-20 19.19.06.png", "photos": [{"src": "assets/images/reviews/r011-1.jpg", "width": 1200, "height": 1211, "alt": "ALIGN gym クチコミ写真 - H様"}]}, {"id": "r012", "displayName": "けんちゃん", "rating": 5, "relativeDate": "2週間前", "approxDate": "2026-07-06", "hasPhoto": true, "featured": true, "tags": ["counseling", "diet", "aroma"], "excerpt": "ただ身体を動かすだけではなく、コーチングで自分の目標や思考を整理してくれるところが唯一無二です。", "body": "栄でジムを探していましたが、ここはただ身体を動かすだけではなく、コーチングで自分の目標や思考を整理してくれるところが唯一無二です。食事管理も無理なく続けられており、おかげさまで身体だけでなくマインドも前向きになれました。店内はアロマの香りが漂う落ち着いた空間で、栄の喧騒を忘れて自分自身と向き合える貴重な時間になっています。この調子で頑張ります！！", "sourceFile": "スクリーンショット 2026-07-20 19.19.19.png", "photos": [{"src": "assets/images/reviews/r012-1.jpg", "width": 792, "height": 603, "alt": "ALIGN gym クチコミ写真 - けんちゃん様"}]}, {"id": "r013", "displayName": "ボンバー", "rating": 5, "relativeDate": "3週間前", "approxDate": "2026-06-29", "hasPhoto": false, "featured": false, "tags": ["counseling", "beginner", "coaching"], "excerpt": "ジム初心者でも安心して通える雰囲気です。本気で身体を変えたい方におすすめです！", "body": "トレーナーさんが親身に話を聞いてくれて、一人ひとりに合ったメニューを提案してくれます。ジム初心者でも安心して通える雰囲気です。フォームの指導も丁寧で、トレーニングの効果を実感できています。これから本気で身体を変えたい方におすすめです！", "sourceFile": "スクリーンショット 2026-07-20 19.17.03.png", "photos": []}, {"id": "r014", "displayName": "Y.A", "rating": 5, "relativeDate": "3週間前", "approxDate": "2026-06-29", "hasPhoto": false, "featured": false, "tags": ["beginner", "clean", "coaching"], "excerpt": "運動経験が少なくても安心でした。運動を始めたい方にもおすすめです。", "body": "ジムの雰囲気がとても良いです。マシンの使い方やトレーニング方法も分かりやすく教えていただけるので、運動経験が少なくても安心でした。施設も清潔感があり、快適に利用できます。運動を始めたい方にもおすすめです。", "sourceFile": "スクリーンショット 2026-07-20 19.17.22.png", "photos": []}, {"id": "r015", "displayName": "R.I", "rating": 5, "relativeDate": "3週間前", "approxDate": "2026-06-29", "hasPhoto": true, "featured": false, "tags": ["access", "aroma", "coaching"], "excerpt": "腕トレで二頭に効きにくいと言った際に丁寧に教えていただき、すごく効くようになりました！", "body": "20代の大学生で、体を変えたくて行ってきました。栄駅から徒歩で30秒と近く、中に入るとアロマの良い香りがすぐに来て、とても爽やかなやりやすい環境で良かったです！また、腕トレで二頭に効きにくいということを言った際に、とても丁寧に教えていただいて、すごく効くようになってコンディショニングの重要性を知ることが出来ました！", "sourceFile": "スクリーンショット 2026-07-20 19.19.24.png", "photos": [{"src": "assets/images/reviews/r015-1.jpg", "width": 1200, "height": 1239, "alt": "ALIGN gym クチコミ写真 - R.I様"}]}, {"id": "r016", "displayName": "H.G", "rating": 5, "relativeDate": "3週間前", "approxDate": "2026-06-29", "hasPhoto": false, "featured": false, "tags": ["beginner", "coaching", "clean"], "excerpt": "初めてパーソナルジムに通いましたが、自分のレベルや目的に合わせて丁寧に指導してくれました。", "body": "初めてパーソナルジムに通いましたが、トレーナーの方がとても親切で、自分のレベルや目的に合わせて丁寧に指導してくれました。フォームも細かく見てもらえるので安心してトレーニングできます。ジム内も清潔感があり、通いやすい雰囲気です。これからも継続して頑張りたいと思います！", "sourceFile": "スクリーンショット 2026-07-20 19.19.34.png", "photos": []}, {"id": "r017", "displayName": "あやか", "rating": 5, "relativeDate": "4週間前", "approxDate": "2026-06-22", "hasPhoto": true, "featured": true, "tags": ["counseling", "beginner", "aroma"], "excerpt": "説明が丁寧で分かりやすく、運動苦手な私にとって通いやすいなと思いました。", "body": "30代半ばの女性で本格的に心身ともに変えていきたく、栄エリアでパーソナルジムを探していました！\n\nカウンセリングと体験トレーニングを受けてみて、説明が丁寧で分かりやすく運動苦手な私にとって通いやすいなと思いました。\n\n木材が多く使われていてリラックスできる空間と、アロマにこだわりがあるようで非常に落ち着いた空間で親身に話を聞いてくれました！\n\n自信をもてるようにこれから頑張ります！", "sourceFile": "スクリーンショット 2026-07-20 19.19.39.png", "photos": [{"src": "assets/images/reviews/r017-1.jpg", "width": 804, "height": 603, "alt": "ALIGN gym クチコミ写真 - あやか様"}]}, {"id": "r018", "displayName": "M.M", "rating": 5, "relativeDate": "1か月前", "approxDate": "2026-06-20", "hasPhoto": true, "featured": false, "tags": ["access", "coaching"], "excerpt": "私の要望に沿った提案をしてくださったり、身体に合わせたストレッチも教えてくださいました。", "body": "Instagramでオープンまでの流れを拝見していました。元々友人の知り合いだったので今回体験に来ました。栄駅からすぐ近くで交通の便には助かります！トレーニングも、私の要望に沿った提案をしてくださったり、身体に合わせたストレッチも教えてくださったりしました。自分のレベルアップの為には、またぜひ来たいです！", "sourceFile": "スクリーンショット 2026-07-20 19.16.36.png", "photos": [{"src": "assets/images/reviews/r018-1.jpg", "width": 786, "height": 603, "alt": "ALIGN gym クチコミ写真 - M.M様"}]}, {"id": "r019", "displayName": "K.T", "rating": 5, "relativeDate": "1か月前", "approxDate": "2026-06-20", "hasPhoto": true, "featured": true, "tags": ["aroma", "coaching", "pain", "posture", "access"], "excerpt": "自分でも気づかなかった姿勢の癖を見つけてくださり、適切なストレッチを教えていただきました！", "body": "アロマの香りがとても良く、リラックスできる素敵な空間でトレーニングさせてもらいました！！\n指導がめちゃめちゃ丁寧で、悩みの腰の痛みを打ち明けるとそれに対するトレーニングを追加してくれました。どのトレーニングも行う前に具体的かつ素人の自分でもわかりやすい言葉選びで説明してくれるので納得感がすごく、トレーニング後の得られる効果が倍増した気分になります！笑\nまた、自分でも気づかなかった姿勢の癖を見つけてくださり、適切なストレッチを教えていただきました！\n\n栄駅からめちゃめちゃ近く、オアシスから徒歩30秒ほどで行けるので通いやすく本当におすすめなジムです♪", "sourceFile": "スクリーンショット 2026-07-20 19.16.43.png", "photos": [{"src": "assets/images/reviews/r019-1.jpg", "width": 1200, "height": 1236, "alt": "ALIGN gym クチコミ写真 - K.T様"}]}, {"id": "r020", "displayName": "H.K", "rating": 5, "relativeDate": "1か月前", "approxDate": "2026-06-20", "hasPhoto": false, "featured": true, "tags": ["diet", "pain", "access", "clean", "aroma"], "excerpt": "通う前は体の痛みがありましたが、コンディショニングをしてもらい、痛みもなくなりました！", "body": "20代男性でダイエット目的で通わせてもらっています！\n\n指導がとても的確でトレーニングがすごく上手くなりましたし、食事も負担なくダイエットが継続できてとても楽しくさせてもらっています😊\n\n通う前は体の痛みがありましたが、コンディションニングをしてもらい、痛みもなくなりました！\n\n栄駅からも近く、とても通いやすいです🙌\n設備もとても綺麗でアロマのいい匂いで環境としてもすごく良いです😊\nトレーナーさんも明るくていつも元気をもらっています✨", "sourceFile": "スクリーンショット 2026-07-20 19.16.57.png", "photos": []}, {"id": "r021", "displayName": "しょうだい", "rating": 5, "relativeDate": "1か月前", "approxDate": "2026-06-20", "hasPhoto": true, "featured": true, "tags": ["pain", "access", "aroma", "coaching"], "excerpt": "元々トレーニング中に肩の痛みがあったのですが、ストレッチとコンディションを教えてくれて痛みがなくなりました！", "body": "肩の痛みと筋肉をつけたくて通いました！\n家から職場の道中にあり、栄駅から近いのでもの凄くありがたいです！\n\nジム内もアロマの香りがするので落ち着いた状態で話ができて、集中した状態でトレーニングをすることができました！\n\n元々トレーニング中に肩の痛みがあったのですが、ストレッチとコンディションを教えてくれて肩の痛みがなくなりました！\n\n定期的によろしくお願いします💪", "sourceFile": "スクリーンショット 2026-07-20 19.17.09.png", "photos": [{"src": "assets/images/reviews/r021-1.jpg", "width": 1166, "height": 1592, "alt": "ALIGN gym クチコミ写真 - しょうだい様"}]}, {"id": "r022", "displayName": "kuru", "rating": 5, "relativeDate": "1か月前", "approxDate": "2026-06-20", "hasPhoto": false, "featured": false, "tags": ["access", "aroma", "coaching", "counseling"], "excerpt": "フォームや身体の使い方など細かい部分まで丁寧に指導していただけました。", "body": "栄駅から近く通いやすいパーソナルジムです。アロマの良い香りでリラックスでき、心身ともに落ち着いた状態でトレーニングを受けられました。\n\n普段からトレーニングをしていますが、フォームや身体の使い方など細かい部分まで丁寧に指導していただけました。コンディショニングやカウンセリングも一つひとつ丁寧に対応していただき、自分の心身と向き合う良い機会になりました。", "sourceFile": "スクリーンショット 2026-07-20 19.19.44.png", "photos": []}, {"id": "r023", "displayName": "shopihama", "rating": 5, "relativeDate": "2年前", "approxDate": "2024-07", "hasPhoto": false, "featured": false, "tags": ["coaching"], "excerpt": "「ここに効かせたい！」というところピンポイントで次の日筋肉痛がきました。褒め上手なのでモチベ高くトレーニングできます。", "body": "丁寧にわかりやすく指示をくださるので、理解しやすく実践しやすいです。しっかり身体の使い方を見てくれるし的確なアドバイスで信頼できます！\n「ここに効かせたい！」というところピンポイントで次の日筋肉痛がきました。褒め上手なのでモチベ高くトレーニングできます^^", "sourceFile": "スクリーンショット 2026-07-20 19.17.27.png", "photos": []}, {"id": "r024", "displayName": "けんけん", "rating": 5, "relativeDate": "2年前", "approxDate": "2024-07", "hasPhoto": false, "featured": false, "tags": ["beginner", "coaching"], "excerpt": "知識のない人にでもわかりやすく丁寧に基礎から教えてくれました。", "body": "知識のない人にでもわかりやすく丁寧に基礎から教えてくれて、トレーニング中もやる気を後押ししてくれるような声掛け、補助などとても好感が持てました。\nまたお願いしたいと思います。", "sourceFile": "スクリーンショット 2026-07-20 19.17.31.png", "photos": []}, {"id": "r025", "displayName": "あぱ", "rating": 5, "relativeDate": "2年前", "approxDate": "2024-07", "hasPhoto": false, "featured": false, "tags": ["beginner", "coaching", "diet"], "excerpt": "ストレッチから丁寧に指導していただきトレーニングもフォーム等を細かく教えて頂けました。", "body": "初めてパーソナルトレーニングを利用させてもらいましたが、ストレッチから丁寧に指導していただきトレーニングもフォーム等を細かく教えて頂けました。\n夏に向けて美ボディを一緒に作って行きたいです！", "sourceFile": "スクリーンショット 2026-07-20 19.17.35.png", "photos": []}, {"id": "r026", "displayName": "ishii hajime", "rating": 5, "relativeDate": "2年前", "approxDate": "2024-07", "hasPhoto": false, "featured": false, "tags": ["coaching", "beginner"], "excerpt": "わかりやすく、自分のペースでやらしてくれるので非常に楽しく運動ができました！！", "body": "わかりやすく、自分のペースでやらしてくれるので非常に楽しく運動ができました！！", "sourceFile": "スクリーンショット 2026-07-20 19.17.39.png", "photos": []}, {"id": "r027", "displayName": "A.T", "rating": 5, "relativeDate": "2年前", "approxDate": "2024-07", "hasPhoto": false, "featured": false, "tags": ["coaching"], "excerpt": "丁寧に分かりやすく教えてくれました。", "body": "丁寧に分かりやすく教えてくれました。", "sourceFile": "スクリーンショット 2026-07-20 19.17.42.png", "photos": []}]};
const grid = document.getElementById('grid');
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.getElementById('avg').textContent = DATA.meta.averageRating.toFixed(1);
document.getElementById('cnt').textContent = DATA.meta.totalReviews + '件のクチコミ';

// 長い口コミには必ず「全部を見る」を表示（4行相当の目安 = 約75文字 または 改行あり）
const isLong = b => b.length > 75 || b.includes('\n');

const used = [...new Set(DATA.reviews.flatMap(r => r.tags))];
const fw = document.getElementById('filters');
[['all','すべて'], ...used.map(t => [t, DATA.tagLabels[t]])].forEach(([k, label], i) => {
  const b = document.createElement('button');
  b.textContent = label; b.dataset.k = k; b.setAttribute('aria-pressed', i === 0);
  b.onclick = () => {
    [...fw.children].forEach(x => x.setAttribute('aria-pressed', x === b));
    document.querySelectorAll('.card').forEach(c =>
      c.classList.toggle('hide', k !== 'all' && !c.dataset.tags.split(',').includes(k)));
  };
  fw.appendChild(b);
});

DATA.reviews.forEach(r => {
  const c = document.createElement('article');
  c.className = 'card'; c.dataset.tags = r.tags.join(',');
  const long = isLong(r.body);
  const ph = r.photos.length
    ? `<div class="ph n${Math.min(r.photos.length,2)}">${r.photos.map(p =>
        `<img src="${p.src}" alt="${esc(p.alt)}" width="${p.width}" height="${p.height}" loading="lazy">`).join('')}</div>`
    : '';
  c.innerHTML = ph + `<div class="body">
      <div class="meta">
        <div class="av">${esc(r.displayName.slice(0,2))}</div>
        <div><div class="nm">${esc(r.displayName)} 様</div><div class="dt">${esc(r.relativeDate)}</div></div>
      </div>
      <div class="stars">${'★'.repeat(r.rating)}</div>
      <p class="ex">${esc(r.excerpt)}</p>
      <p class="tx${long ? ' clamp' : ''}">${esc(r.body)}</p>
      ${long ? '<button class="more">全部を見る</button>' : ''}
      <div class="tags">${r.tags.map(t => `<span class="tag">${DATA.tagLabels[t]}</span>`).join('')}</div>
    </div>`;
  if (long) {
    const btn = c.querySelector('.more'), tx = c.querySelector('.tx');
    btn.onclick = () => {
      const open = c.classList.toggle('open');
      tx.classList.toggle('clamp', !open);
      btn.textContent = open ? '閉じる' : '全部を見る';
    };
  }
  grid.appendChild(c);
});

const lb = document.getElementById('lb');
grid.addEventListener('click', e => {
  if (e.target.tagName === 'IMG') { lb.querySelector('img').src = e.target.src; lb.classList.add('on'); }
});
lb.onclick = () => lb.classList.remove('on');
</script>
